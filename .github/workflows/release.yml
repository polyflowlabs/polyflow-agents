name: Release to stores

# Builds production binaries and submits them to App Store Connect and Google
# Play. Runs in the `production` environment, so with a required reviewer set on
# that environment every store submission waits for a manual approval — the last
# line of defence if a dependency or the Expo token is ever compromised.
#
# The only GitHub secret this needs is EXPO_TOKEN. The App Store Connect API key
# and the Google Play service account live on EAS — see CONTRIBUTING.md.
#
# The Android binary is also attached to the workflow run as an artifact, and on
# a tag push to a GitHub Release for that tag, so a release can be sideloaded or
# archived without going through the EAS dashboard.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to release
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: Submit the build to the store after it finishes
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  platforms:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - name: Resolve platforms
        id: plan
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            all) platforms='["ios","android"]' ;;
            ios) platforms='["ios"]' ;;
            android) platforms='["android"]' ;;
            *) echo "unknown platform '$PLATFORM'" >&2; exit 1 ;;
          esac
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}

  release:
    name: Release ${{ matrix.platform }}
    needs: platforms
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    # `write` only so the Android leg can create the GitHub Release and upload
    # the binary to it; the job is already gated by the environment reviewer.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `--wait` blocks until the build finishes; the JSON tail carries the build
      # id, so the submit step targets this exact build rather than whatever
      # `--latest` happens to point at by then.
      - name: Build
        id: build
        run: |
          set -euo pipefail
          eas build \
            --platform "$MATRIX_PLATFORM" \
            --profile production \
            --message "${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --non-interactive \
            --wait \
            --json > build.json
          build_id="$(jq -r '.[0].id' build.json)"
          if [ -z "$build_id" ] || [ "$build_id" = "null" ]; then
            echo "could not read a build id from eas build output" >&2
            cat build.json >&2
            exit 1
          fi
          echo "id=$build_id" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' build.json)" >> "$GITHUB_OUTPUT"
          echo "- \`$MATRIX_PLATFORM\`: built \`$build_id\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      # Play wants an App Bundle, but a phone cannot install one, so the release
      # also carries a universal APK signed with the same keystore. Built after
      # the bundle, with autoIncrement off, so both share one versionCode and a
      # sideloaded install can later be upgraded from Play.
      - name: Build APK
        id: apk
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile production-apk \
            --message "${GITHUB_REF_NAME} (${GITHUB_SHA::7}) apk" \
            --non-interactive \
            --wait \
            --json > apk.json
          apk_id="$(jq -r '.[0].id' apk.json)"
          if [ -z "$apk_id" ] || [ "$apk_id" = "null" ]; then
            echo "could not read a build id from eas build output" >&2
            cat apk.json >&2
            exit 1
          fi
          echo "url=$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' apk.json)" >> "$GITHUB_OUTPUT"
          echo "- \`android\`: built apk \`$apk_id\`" >> "$GITHUB_STEP_SUMMARY"

      # EAS keeps the binaries for a limited time; the workflow run keeps its own
      # copy. Only Android — the iOS .ipa is useless outside App Store Connect.
      - name: Download Android binaries
        id: binary
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          # Artifact names cannot contain slashes (branch names can, on dispatch).
          ref="${GITHUB_REF_NAME//\//-}"
          mkdir -p artifact
          for pair in "aab=$AAB_URL" "apk=$APK_URL"; do
            ext="${pair%%=*}"
            url="${pair#*=}"
            if [ -z "$url" ]; then
              echo "eas build output carried no artifact url for the $ext" >&2
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 3 \
              --output "artifact/polyflow-agents-${ref}-android.${ext}" \
              "$url"
          done
          ls -l artifact
          echo "name=android-${ref}" >> "$GITHUB_OUTPUT"
        env:
          AAB_URL: ${{ steps.build.outputs.url }}
          APK_URL: ${{ steps.apk.outputs.url }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform == 'android'
        with:
          name: ${{ steps.binary.outputs.name }}
          path: artifact/
          if-no-files-found: error

      # Before the store submission so a Play Console hiccup cannot leave a tag
      # without its binaries. The assets carry no version in their names so
      # `releases/latest/download/polyflow-agents-android.apk` is a permanent
      # link to the newest build. Idempotent: a re-run reuses the release and
      # overwrites the assets.
      - name: Publish GitHub Release
        if: matrix.platform == 'android' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          mkdir -p release
          for f in artifact/*; do
            cp "$f" "release/polyflow-agents-android.${f##*.}"
          done
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "- \`android\`: attached to release [$TAG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}

      - name: Submit to store
        if: inputs.submit != false
        run: |
          eas submit \
            --platform "$MATRIX_PLATFORM" \
            --profile production \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait
          echo "- \`$MATRIX_PLATFORM\`: submitted \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          BUILD_ID: ${{ steps.build.outputs.id }}
